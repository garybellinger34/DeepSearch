<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>DeepSearch</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b0f14;
    color: #e6edf3;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #0b0f14ee;
    backdrop-filter: blur(10px);
    padding: 14px 12px 10px;
    border-bottom: 1px solid #1f2937;
  }
  h1 { font-size: 1.1rem; margin: 0 0 10px; letter-spacing: .5px; }
  .searchbar { display: flex; gap: 8px; }
  input[type="search"] {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    border-radius: 999px;
    border: 1px solid #263241;
    background: #111827;
    color: #e6edf3;
    font-size: 1rem;
    outline: none;
  }
  button {
    padding: 12px 16px;
    border-radius: 999px;
    border: 0;
    background: #2563eb;
    color: white;
    font-weight: 600;
    font-size: .95rem;
  }
  button:disabled { opacity: .5; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px 14px;
    margin-top: 10px; font-size: .85rem; color: #9ca3af;
  }
  label { display: flex; align-items: center; gap: 6px; }
  main { padding: 12px; max-width: 820px; margin: 0 auto; }
  .status { color: #9ca3af; font-size: .9rem; margin: 8px 0 14px; }
  .result {
    padding: 14px 0;
    border-bottom: 1px solid #1f2937;
  }
  .result a {
    color: #93c5fd;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.35;
  }
  .result a:visited { color: #c4b5fd; }
  .snippet { color: #b6c2cf; font-size: .92rem; line-height: 1.45; margin-top: 6px; }
  .meta { color: #6b7280; font-size: .78rem; margin-top: 6px; }
  .empty { color: #9ca3af; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>DeepSearch</h1>
  <form class="searchbar" id="searchForm">
    <input type="search" id="q" placeholder="Search without the noise…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" id="go">Search</button>
  </form>
  <div class="controls">
    <label><input type="checkbox" id="filterAds" checked> Filter ads/paid</label>
    <label><input type="checkbox" id="includeWiki" checked> Wikipedia</label>
  </div>
</header>
<main>
  <div class="status" id="status">Ready.</div>
  <div id="results"></div>
</main>
<script>
// Your Cloudflare Worker URL is now built in!
const WORKER_URL = "https://bold-night-8199.garybellinger34.workers.dev/";

const form = document.getElementById("searchForm");
const qInput = document.getElementById("q");
const goBtn = document.getElementById("go");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const filterAds = document.getElementById("filterAds");
const includeWiki = document.getElementById("includeWiki");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = qInput.value.trim();
  if (!q) return;
  goBtn.disabled = true;
  statusEl.textContent = "Searching…";
  resultsEl.innerHTML = "";
  try {
    const url = new URL(WORKER_URL);
    url.searchParams.set("q", q);
    url.searchParams.set("filterAds", filterAds.checked ? "1" : "0");
    url.searchParams.set("includeWiki", includeWiki.checked ? "1" : "0");
    const res = await fetch(url.toString());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const results = data.results || [];
    statusEl.textContent = results.length ? `${results.length} results for “${q}”` : "No results.";
    if (!results.length) {
      resultsEl.innerHTML = '<div class="empty">Nothing found. Try different keywords.</div>';
      return;
    }
    resultsEl.innerHTML = results.map(r => `
      <div class="result">
        <a href="${escapeAttr(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title || r.url)}</a>
        <div class="snippet">${escapeHtml(r.snippet || "")}</div>
        <div class="meta">${escapeHtml(r.source || "")} · ${escapeHtml(hostname(r.url))}</div>
      </div>
    `).join("");
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  } finally {
    goBtn.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, "&#96;");
}
function hostname(url) {
  try { return new URL(url).hostname; } catch { return ""; }
}
</script>
</body>
</html>
